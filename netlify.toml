# ─────────────────────────────────────────────────────────────────────────
#  Netlify config — defense in depth for the published Big Bad Wolf site.
#
#  Netlify already refuses to serve dotfiles (.env, .git/, .DS_Store, .claude/),
#  so your API keys can't be downloaded. These rules add explicit, forced 404s
#  for the local-only / non-public paths too — so even if the whole project
#  folder is uploaded, none of it can be requested. The game only needs
#  index.html, app.js, styles.css and assets/.
# ─────────────────────────────────────────────────────────────────────────

[build]
  publish = "."

# ── Hard-block sensitive / local-only paths (forced 404, overrides real files) ──
[[redirects]]
  from = "/.env"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env.*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"        # node scripts that read .env (no keys inside, but not needed publicly)
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"        # math model / par-sheet deliverables — not for the public player build
  to = "/index.html"
  status = 404
  force = true

# ── Basic security headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "SAMEORIGIN"
